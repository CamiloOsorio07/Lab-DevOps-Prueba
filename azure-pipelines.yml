trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

stages:
  # -------------------------------------------------------------
  # STAGE 1: CI (Build, Test y Publicación del Artefacto)
  # -------------------------------------------------------------
  - stage: CI
    displayName: 'CI - Build & Test'
    jobs:
      - job: BuildAndPackage
        displayName: 'Build and Archive'
        steps:
          - script: node -v
            displayName: 'Verificar versión de Node.js'

          - script: npm ci
            displayName: 'Instalar Dependencias'

          - script: npm test
            displayName: 'Ejecutar Pruebas Unitarias'

          - task: ArchiveFiles@2
            displayName: 'Empaquetar Artefacto (.zip)'
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/app-$(Build.BuildId).zip'
              replaceExistingArchive: true

          - task: PublishBuildArtifacts@1
            displayName: 'Publicar Artefacto en Azure DevOps'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'
              publishLocation: 'Container'

  # -------------------------------------------------------------
  # STAGE 2: DESPLIEGUE A DEV
  # -------------------------------------------------------------
  - stage: DEV
    displayName: 'Deploy DEV'
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: DeployDEV
        environment: 'DEV'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Desplegando versión $(Build.BuildId) en ambiente DEV..."
                    echo "Configurando variable APP_ENVIRONMENT=DEV"
                  displayName: 'Simular Despliegue DEV'

  # -------------------------------------------------------------
  # STAGE 3: DESPLIEGUE A QA
  # -------------------------------------------------------------
  - stage: QA
    displayName: 'Deploy QA'
    dependsOn: DEV
    condition: succeeded()
    jobs:
      - deployment: DeployQA
        environment: 'QA'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Desplegando versión $(Build.BuildId) en ambiente QA..."
                    echo "Configurando variable APP_ENVIRONMENT=QA"
                  displayName: 'Simular Despliegue QA'

  # -------------------------------------------------------------
  # STAGE 4: DESPLIEGUE A PDN (Requiere Aprobación Manual)
  # -------------------------------------------------------------
  - stage: PDN
    displayName: 'Deploy PDN'
    dependsOn: QA
    condition: succeeded()
    jobs:
      - deployment: DeployPDN
        environment: 'PDN'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "Desplegando versión $(Build.BuildId) en ambiente PDN..."
                    echo "Configurando variable APP_ENVIRONMENT=PDN"
                  displayName: 'Simular Despliegue PDN'